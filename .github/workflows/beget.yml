name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-production
  cancel-in-progress: false

jobs:
  connection-diagnostics:
    name: Record FTP connection for Beget support
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Record public IPv4 and timed connection without authentication
        run: |
          python3 - <<'PY'
          import datetime, ipaddress, os, socket, urllib.request
          try:
              with urllib.request.urlopen('https://api.ipify.org', timeout=10) as response:
                  address = str(ipaddress.IPv4Address(response.read(64).decode().strip()))
              print('RUNNER_PUBLIC_IPV4=' + address, flush=True)
          except Exception as exc:
              print('PUBLIC_IP_LOOKUP=' + type(exc).__name__, flush=True)
          print('FTP_ATTEMPT_UTC=' + datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          try:
              destination = socket.getaddrinfo(os.environ['FTP_SERVER'], 21, socket.AF_INET, socket.SOCK_STREAM)[0][4]
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as connection:
                  connection.settimeout(12)
                  connection.connect(destination)
                  print('FTP_PORT_21=connected', flush=True)
          except Exception as exc:
              print('FTP_PORT_21=' + type(exc).__name__, flush=True)
          print('FTP_FINISHED_UTC=' + datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          PY
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: elimora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check recommendation logic
        run: node --test tests/*.test.mjs
      - name: Check cabinet PHP syntax and isolation
        env:
          CI_DB_PASSWORD: ci-only-password
        run: |
          find cabinet -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/availability_checks.php
          python3 tests/cabinet_checks.py
      - name: Upload website over explicit FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_beget.py
